# Actualizaciones de dependencias (CLAUDE.md, Seguridad). Las de seguridad llegan aparte,
# en cuanto se publican. Cada PR pasa por la CI y por el preview de Vercel.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Saltos de versión mayor que no se aceptan desde un PR automático (T25):
    # - next (y eslint-config-next, que la acompaña) y tailwindcss: el stack está fijado en CLAUDE.md (Next 15, Tailwind 3.4).
    #   Migrar es una tanda propia (cambia la config, el mapeo a tokens o el router).
    # - @types/node: los tipos siguen al Node mínimo que soportamos (`engines`), no al último.
    # Las actualizaciones de seguridad no pasan por aquí: llegan igual.
    ignore:
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: eslint-config-next # va con la versión de next
        update-types: [version-update:semver-major]
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      # Menores y parches juntos: un PR por semana en lugar de uno por paquete.
      menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
