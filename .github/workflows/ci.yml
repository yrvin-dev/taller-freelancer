# CI de cada PR y de main (T23a). Vercel despliega por su cuenta (previews por PR y
# producción en main); este workflow es el que marca si el cambio se puede mergear.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un push nuevo a la misma rama cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tipos y tests unitarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # versión: `packageManager` de package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - name: Sin colores fuera de tokens.css (regla 1)
        run: pnpm check:tokens
      - run: pnpm test
      - name: Dependencias de producción sin vulnerabilidades altas
        run: pnpm audit --prod --audit-level high

  e2e:
    name: Integración y e2e (Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # config.toml activa Google con estas variables. El OAuth no se prueba en CI (los
      # e2e entran con el usuario demo): basta con que no estén vacías.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-sin-google
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-sin-google
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Solo lo que usa la app: Postgres, Auth, PostgREST y Kong (gateway).
      - name: Supabase local (migraciones + seed)
        run: >-
          pnpm db:start -x
          storage-api,imgproxy,realtime,studio,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta

      - name: database.types.ts al día con las migraciones
        run: pnpm db:types && git diff --exit-code src/lib/database.types.ts

      # Como en local: URL y claves de `supabase status`. La clave de cifrado es nueva en
      # cada corrida (el seed no trae credenciales cifradas) y nunca sale del runner.
      - name: .env.local para la app y los tests
        run: |
          eval "$(pnpm --silent exec supabase status -o env)"
          key="$(openssl rand -base64 32)"
          echo "::add-mask::$key"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3100"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "CREDENTIALS_KEY=$key"
            echo "CREDENTIALS_KEY_VERSION=1"
          } > .env.local

      - run: pnpm test:integration

      - run: pnpm exec playwright install --with-deps chromium
      # Compila su propio build de producción (.next-e2e) y lo levanta en el puerto 3100.
      - run: pnpm test:e2e

      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
